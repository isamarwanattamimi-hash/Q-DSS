<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-DSS | Hubungi & Saran</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #001d3d 0%, #000 90%);
            overflow-x: hidden;
            position: relative;
        }

        /* --- BACKGROUND STARS --- */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.4;
            z-index: -1;
        }

        /* --- TOMBOL KEMBALI --- */
        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #4cc9f0;
            text-decoration: none;
            font-family: 'Orbitron';
            border: 1px solid #4cc9f0;
            padding: 10px 20px;
            border-radius: 5px;
            background: rgba(0,0,0,0.7);
            transition: 0.3s;
            z-index: 10;
        }
        .btn-back:hover { 
            background: #4cc9f0; 
            color: #000; 
            box-shadow: 0 0 15px #4cc9f0; 
        }

        /* --- KOTAK FORMULIR (GLASSMORPHISM) --- */
        .suggestion-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(76, 201, 240, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(76, 201, 240, 0.05);
            text-align: center;
            position: relative;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .suggestion-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(76, 201, 240, 0.4), transparent);
            border-radius: 20px;
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #4cc9f0;
            margin-bottom: 30px;
            font-family: 'Orbitron';
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- INPUT STYLING --- */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 15px;
            color: rgba(255, 255, 255, 0.4);
            transition: 0.3s;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            border-radius: 8px;
            transition: 0.3s;
        }

        .input-group textarea {
            height: 120px;
            resize: none;
        }

        /* Efek Fokus Input */
        .input-group input:focus, 
        .input-group textarea:focus {
            border-color: #4cc9f0;
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.3);
            background: rgba(0, 0, 0, 0.8);
        }

        .input-group input:focus ~ i,
        .input-group textarea:focus ~ i {
            color: #4cc9f0;
        }

        /* --- TOMBOL KIRIM --- */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #4cc9f0, #4361ee);
            border: none;
            outline: none;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(76, 201, 240, 0.7);
            background: linear-gradient(45deg, #4361ee, #4cc9f0);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <a href="index.html" class="btn-back">← KEMBALI</a>

    <div class="suggestion-container">
        <h1>TRANSMISI SARAN</h1>
        <p class="subtitle">Bantu Kami Memperbaiki Galaksi Ini</p>

        <form id="suggestionForm">
            <div class="input-group">
                <input type="text" id="name" placeholder="Nama Penjelajah..." required>
                <i class="fa-solid fa-user-astronaut"></i>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email Koordinat..." required>
                <i class="fa-solid fa-satellite-dish"></i>
            </div>

            <div class="input-group">
                <textarea id="message" placeholder="Tuliskan saran atau pesan kosmik Anda di sini..." required></textarea>
                <i class="fa-solid fa-comment-dots"></i>
            </div>

            <button type="submit" class="btn-submit">
                KIRIM TRANSMISI <i class="fa-solid fa-paper-plane" style="margin-left: 8px;"></i>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('suggestionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Mengambil input data
            const nama = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const pesan = document.getElementById('message').value;

            // Efek simulasi kirim sukses sementara
            alert('Transmisi berhasil dikirim!\nTerima kasih, Agen ' + nama + '. Kontribusi Anda tercatat di database Astrospace.');
            
            // Reset form otomatis setelah kirim
            this.reset();
        });
    </script>
</body>
</html>
